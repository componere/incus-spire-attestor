# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: incus-spire-attestor

gomod:
  proxy: true
  env:
    - GOTOOLCHAIN=local
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org

builds:
  - id: incus-agent
    main: ./cmd/incus-agent
    binary: incus-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: incus-server
    main: ./cmd/incus-server
    binary: incus-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    ids:
      - incus-agent
      - incus-server
    formats:
      - binary
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: release
    ids:
      - incus-agent
      - incus-server
    package_name: incus-spire-attestor
    vendor: Componere
    homepage: https://github.com/componere/incus-spire-attestor
    maintainer: Componere
    description: SPIRE node attestor plugins for Incus virtual machines.
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    rpm:
      signature:
        key_file: '{{ envOrDefault "RELEASE_RPM_SIGNING_KEY_FILE" "" }}'
    apk:
      signature:
        key_file: '{{ envOrDefault "RELEASE_APK_SIGNING_KEY_FILE" "" }}'
        key_name: incus-spire-attestor-001

checksum:
  name_template: checksums.txt

sboms:
  - id: binaries
    artifacts: binary
  - id: packages
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  disable: true

release:
  disable: true

# Minimal, multi-arch carrier image for the SPIRE NodeAttestor plugin
# binaries. SPIRE launches the plugins as child processes, so this image is
# not a runnable application: its purpose is an init-container or
# `COPY --from` source that places `/usr/bin/incus-server` (and, if wanted,
# `/usr/bin/incus-agent`) into a containerized SPIRE deployment.
#
# `release-cli image build` appends the local apk repository and its ephemeral
# per-architecture signing key, so this file names the package plainly and
# never references a local repository or keyring.
#
# The image version and revision annotations are injected from the release tag
# and the tagged commit; do not hardcode them here. The image verifier compares
# both against the release it is building, and requires the entrypoint to name
# one staged binary.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - incus-spire-attestor

entrypoint:
  command: /usr/bin/incus-server

# Create the nonroot user/group (uid/gid 65532) and run as it, mirroring
# distroless:nonroot; Wolfi has no `nonroot` package.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/bin

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: incus-spire-attestor
  org.opencontainers.image.description: SPIRE node attestor plugins for Incus virtual machines
  org.opencontainers.image.source: https://github.com/componere/incus-spire-attestor
  org.opencontainers.image.licenses: Apache-2.0 OR MIT

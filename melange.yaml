# Packages the canonical Linux plugin binaries that GoReleaser already staged
# into a Wolfi apk; apko.yaml then assembles the minimal multi-arch carrier
# image.
#
# This configuration compiles nothing. `release-cli image build` stages each
# reviewed binary under its own name in the per-architecture source tree and
# writes the release version into a vars file, so the image and the GitHub
# Release assets are the same bytes. Do not reintroduce a `go/build` pipeline:
# that would produce a second, unattested binary.
package:
  name: incus-spire-attestor
  version: ${{vars.version}}
  epoch: 0
  description: SPIRE node attestor plugins for Incus virtual machines
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: Apache-2.0 OR MIT

# Overridden at build time by the vars file the CLI writes from the release tag.
vars:
  version: 0.0.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm755 -o 0 -g 0 incus-agent "${{targets.destdir}}/usr/bin/incus-agent"
      install -Dm755 -o 0 -g 0 incus-server "${{targets.destdir}}/usr/bin/incus-server"

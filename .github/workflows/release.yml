# Tag-triggered release. Every `uses:` reference and the
# `checksum-signing-workflow-ref` pin one reviewed meigma/release commit; that
# single revision is the release unit (reusable workflows, setup action, and
# the release-cli stamp). A mixed revision is not a supported state.
#
# Release Please owns the tag, the notes, and the initial draft. The jobs
# below build, verify, sign, and then publish: GitHub Release assets and the
# GHCR carrier image.
#
# Required settings:
# - vars.COMPONERE_RELEASE_APP_CLIENT_ID / secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY
#   (organization level, scoped to this repository)
# - secrets.RPM_SIGNING_KEY, RPM_SIGNING_PASSPHRASE, APK_SIGNING_KEY,
#   APK_SIGNING_PASSPHRASE (repository level)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-assets:
    name: Build release assets
    if: github.event.deleted == false
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: meigma/release/.github/workflows/go-pre-publish.yml@09d6be776ca4a9d533101bae1fbc790fb42050a8
    with:
      sign-and-notarize-macos: false
      sign-native-packages: true
    secrets:
      rpm-signing-key: ${{ secrets.RPM_SIGNING_KEY }}
      rpm-signing-passphrase: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
      apk-signing-key: ${{ secrets.APK_SIGNING_KEY }}
      apk-signing-passphrase: ${{ secrets.APK_SIGNING_PASSPHRASE }}

  oci-image:
    name: Build OCI image
    needs: release-assets
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: meigma/release/.github/workflows/go-oci-build.yml@09d6be776ca4a9d533101bae1fbc790fb42050a8
    with:
      artifact-id: ${{ needs.release-assets.outputs.oci-input-artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.oci-input-artifact-digest }}

  oci-publish:
    name: Publish OCI image
    needs: oci-image
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: meigma/release/.github/workflows/publish-oci-image.yml@09d6be776ca4a9d533101bae1fbc790fb42050a8
    with:
      artifact-id: ${{ needs.oci-image.outputs.artifact-id }}
      artifact-digest: ${{ needs.oci-image.outputs.artifact-digest }}
      image-digest: ${{ needs.oci-image.outputs.image-digest }}
      publish-image: true

  github-release:
    name: Publish GitHub Release
    needs:
      - release-assets
      - oci-publish
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: meigma/release/.github/workflows/publish-github-release.yml@09d6be776ca4a9d533101bae1fbc790fb42050a8
    with:
      artifact-id: ${{ needs.release-assets.outputs.artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.artifact-digest }}
      checksum-signing-workflow-ref: meigma/release/.github/workflows/go-pre-publish.yml@09d6be776ca4a9d533101bae1fbc790fb42050a8
      require-oci-image: true
      oci-image-reference: ${{ needs.oci-publish.outputs.image-reference }}
      release-app-client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
      publish-release: true
    secrets:
      release-app-private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}

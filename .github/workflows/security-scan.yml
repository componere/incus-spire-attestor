name: Security Scan

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary-vulnerability-scan:
    name: Binary Vulnerability Scan (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          cache: true

      - name: Cross-build both plugins
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p scan-input
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build -trimpath \
            -ldflags="-s -w -buildid=" \
            -o scan-input/incus-agent ./cmd/incus-agent
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build -trimpath \
            -ldflags="-s -w -buildid=" \
            -o scan-input/incus-server ./cmd/incus-server
          test -f scan-input/incus-agent
          test -f scan-input/incus-server

      - name: Scan plugin binaries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: scan-input
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results-${{ matrix.arch }}.sarif
          exit-code: "1"
          hide-progress: true
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: ${{ always() && hashFiles(format('trivy-results-{0}.sarif', matrix.arch)) != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results-${{ matrix.arch }}.sarif
          category: binary-vulnerability-scan-${{ matrix.arch }}
